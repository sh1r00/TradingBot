# Netlify deployment configuration for Money Conversion SPA
# Static site generated via Nuxt 4 (nuxi generate)

[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"

# Security headers applied to all routes
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri https://csp-report.example.com/report"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Service worker must not be cached by CDN/browser
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

# Web app manifest must not be cached by CDN/browser
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

# SPA fallback: redirect all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
